<!DOCTYPE html>
<html>
<head>
    <title>Chat Room</title>
</head>
<body>
    <h1>Chat Room</h1>
    <div id="messages">
        {% for msg in messages %}
            <p><b>{{ msg.sender.username }}</b>: {{ msg.text }}</p>
        {% endfor %}
    </div>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="text" placeholder="Type a message...">
        <button type="submit">Send</button>
    </form>
</body>
</html>
